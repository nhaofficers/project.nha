services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nha_dpams
      POSTGRES_USER: nha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nha -d nha_dpams"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://nha:${POSTGRES_PASSWORD}@postgres:5432/nha_dpams?schema=public
      STORAGE_PATH: /app/storage
      FRONTEND_URL: https://${PUBLIC_HOSTNAME:-localhost}
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres: { condition: service_healthy }
    networks: [internal]
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args: { NEXT_PUBLIC_API_URL: /api/v1 }
    restart: unless-stopped
    depends_on: [backend]
    networks: [internal]
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/certs:/etc/nginx/certs:ro
    depends_on: [frontend, backend]
    networks: [internal]
networks:
  internal:
    driver: bridge
volumes:
  postgres_data:
